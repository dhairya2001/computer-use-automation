<!doctype html>
<html>
<head><title>CoreServ 7.2 - Sub-Account Confirmation</title></head>
<body bgcolor="#f0f0f0" style="font-family:Verdana,Arial,sans-serif;font-size:12px">
<table width="760" align="center" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="margin-top:24px;border:1px solid #999">
  <tr bgcolor="#00662e"><td style="padding:8px;color:#fff;font-weight:bold">CoreServ&nbsp;7.2 &mdash; Sub-Account Opened</td></tr>
  <tr><td style="padding:20px">
    <!-- The success checkpoint for the 'action' capability: the confirmation screen. -->
    <span style="font-weight:bold;color:#00662e;font-size:14px">Sub-account created successfully.</span>
    <table cellpadding="4" cellspacing="0" border="0" width="100%" style="margin-top:12px">
      <tr><td width="200" style="color:#666">New Sub-Account ID</td><td><b>{{ new_id }}</b></td></tr>
      <tr><td style="color:#666">Parent Member</td><td>{{ m.name }} (ID {{ m.member_id }})</td></tr>
      <tr><td style="color:#666">Account Type</td><td>{{ acct_type }}</td></tr>
      <tr><td style="color:#666">Initial Deposit</td><td>{{ deposit }}</td></tr>
    </table>
    <p style="padding-top:14px"><a href="/search">Return to lookup</a></p>
  </td></tr>
</table>
</body>
</html>
