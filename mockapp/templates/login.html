<!doctype html>
<html>
<head><title>CoreServ 7.2 - Operator Login</title></head>
<body bgcolor="#f0f0f0" style="font-family:Verdana,Arial,sans-serif;font-size:12px">
<!-- Legacy layout: everything in tables, no semantic markup, no test ids. -->
<table width="640" align="center" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="margin-top:40px;border:1px solid #999">
  <tr bgcolor="#003366"><td style="padding:8px;color:#fff;font-weight:bold">CoreServ&nbsp;7.2 &mdash; Member Servicing Console</td></tr>
  <tr><td style="padding:20px">
    <table cellpadding="4" cellspacing="0" border="0">
      <form method="post" action="/login">
      <tr><td colspan="2" style="font-weight:bold;padding-bottom:8px">Operator Sign In</td></tr>
      {% if error %}<tr><td colspan="2" style="color:#a00;padding-bottom:8px">{{ error }}</td></tr>{% endif %}
      <tr><td>Operator ID:</td><td><input type="text" name="operator_id" size="24"></td></tr>
      <tr><td>Passcode:</td><td><input type="password" name="passcode" size="24"></td></tr>
      <tr><td colspan="2" style="padding-top:10px"><input type="submit" value="Sign In"></td></tr>
      </form>
    </table>
    <p style="color:#666;font-size:11px">Demo credentials: any Operator ID, passcode <b>demo</b>.</p>
  </td></tr>
</table>
</body>
</html>
