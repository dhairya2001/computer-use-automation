<!DOCTYPE html><html><head><title>CoreServ 7.2 - New Sub-Account</title></head>
<body bgcolor="#f0f0f0" style="font-family:Verdana,Arial,sans-serif;font-size:12px">
<table width="760" align="center" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="margin-top:24px;border:1px solid #999">
  <tbody><tr bgcolor="#003366"><td style="padding:8px;color:#fff;font-weight:bold">CoreServ&nbsp;7.2 — Open New Sub-Account</td></tr>
  <tr><td style="padding:20px">
    <table cellpadding="4" cellspacing="0" border="0">
      <tbody><tr><td colspan="2" style="padding-bottom:8px">Member: <b>Sam Example</b> (ID 33333)</td></tr>
      
      <form method="post" action="/member/33333/new-subaccount"></form>
      <tr>
        <td>Account Type:</td>
        <!-- select identified by name + option text only -->
        <td><select name="account_type">
          <option>Savings</option>
          <option>Money Market</option>
          <option>Certificate of Deposit</option>
        </select></td>
      </tr>
      <tr>
        <td>Initial Deposit:</td>

      </tr>
      <tr><td colspan="2" style="padding-top:10px">
        <!-- Risky/irreversible action: this button creates an account.
             The safety layer treats 'submit that creates/opens' conservatively. -->
        <input type="submit" value="Open Sub-Account" style="">
      </td></tr>
      
    </tbody></table>
  </td></tr>
</tbody></table>
